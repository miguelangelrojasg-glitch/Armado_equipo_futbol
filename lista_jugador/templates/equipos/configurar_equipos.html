{% extends "base.html" %}
{% block title %}Estrategia | Futbol Team{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-5 text-center">
            
            <div class="mb-4">
                <i class="bi bi-controller text-info" style="font-size: 3rem;"></i>
                <h2 class="fw-bold mt-2 text-white">Estrategia del Partido</h2>
                <p class="text-soft">Seleccioná el enfoque táctico que querés darle a cada equipo.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="row g-4 mb-5 text-start">
                    
                    <div class="col-md-6">
                        <div class="p-3" style="background: rgba(34, 197, 94, 0.05); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 16px;">
                            <label class="form-label text-success fw-bold"><i class="bi bi-shield-fill me-1"></i> Equipo A</label>
                            <select name="enfoque_a" class="form-select bg-dark text-white border-secondary" style="border-radius: 10px;">
                                <option value="EQUILIBRADO" selected>⚖️ Equilibrado</option>
                                <option value="OFENSIVO">⚡ Ofensivo</option>
                                <option value="DEFENSIVO">🧱 Defensivo</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="p-3" style="background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 16px;">
                            <label class="form-label text-info fw-bold"><i class="bi bi-shield-fill me-1"></i> Equipo B</label>
                            <select name="enfoque_b" class="form-select bg-dark text-white border-secondary" style="border-radius: 10px;">
                                <option value="EQUILIBRADO" selected>⚖️ Equilibrado</option>
                                <option value="OFENSIVO">⚡ Ofensivo</option>
                                <option value="DEFENSIVO">🧱 Defensivo</option>
                            </select>
                        </div>
                    </div>

                </div>

                <div class="d-flex gap-3">
                    <a href="{% url 'resumen_lista' lista.id %}" class="btn btn-outline-secondary flex-grow-1" style="border-radius: 12px;">Volver</a>
                    <button type="submit" class="btn btn-main flex-grow-1" style="border-radius: 12px;">
                        Generar Equipos <i class="bi bi-magic ms-1"></i>
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
