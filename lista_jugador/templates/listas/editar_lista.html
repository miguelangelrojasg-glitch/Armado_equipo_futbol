{% extends "base.html" %}
{% block title %}Editar Lista | Futbol Team{% endblock %}

{% block extra_css %}
<style>
    .form-control-custom, .form-select-custom {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 12px;
        padding: 12px 16px;
        transition: all 0.3s ease;
    }
    .form-control-custom:focus, .form-select-custom:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        color: white;
        outline: none;
    }
    .form-select-custom option { 
        background-color: #0f172a; 
        color: white; 
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5" style="border-radius: 20px;">
            
            <div class="d-flex align-items-center mb-4 pb-2 border-bottom border-secondary border-opacity-25">
                <i class="bi bi-pencil-square fs-2 text-info me-3"></i>
                <div>
                    <h2 class="fw-bold m-0 text-white">Editar Lista</h2>
                    <span class="text-soft small">Modifica los detalles de tu convocatoria</span>
                </div>
            </div>

            <form method="POST" action="">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="nombre" class="form-label text-soft fw-bold"><i class="bi bi-card-text me-1"></i> Nombre de la lista</label>
                    <input type="text" class="form-control-custom w-100" id="nombre" name="nombre" value="{{ lista.nombre }}" required>
                </div>

                <div class="mb-5">
                    <label for="cantidad" class="form-label text-soft fw-bold"><i class="bi bi-people me-1"></i> Cantidad de jugadores</label>
                    <select class="form-select-custom w-100" id="cantidad" name="cantidad_jugadores" required>
                        <option value="10" {% if lista.cantidad_jugadores == 10 %}selected{% endif %}>10 Jugadores (Fútbol 5)</option>
                        <option value="12" {% if lista.cantidad_jugadores == 12 %}selected{% endif %}>12 Jugadores (Fútbol 6)</option>
                        <option value="14" {% if lista.cantidad_jugadores == 14 %}selected{% endif %}>14 Jugadores (Fútbol 7)</option>
                        <option value="16" {% if lista.cantidad_jugadores == 16 %}selected{% endif %}>16 Jugadores (Fútbol 8)</option>
                        <option value="18" {% if lista.cantidad_jugadores == 18 %}selected{% endif %}>18 Jugadores (Fútbol 9)</option>
                        <option value="20" {% if lista.cantidad_jugadores == 20 %}selected{% endif %}>20 Jugadores (Fútbol 10)</option>
                        <option value="22" {% if lista.cantidad_jugadores == 22 %}selected{% endif %}>22 Jugadores (Fútbol 11)</option>
                    </select>
                </div>

                <div class="d-flex gap-3">
                    <a href="{% url 'index' %}" class="btn btn-soft w-50">
                        <i class="bi bi-x-lg me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-main w-50">
                        <i class="bi bi-check-lg me-1"></i> Guardar
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
