{% extends "base.html" %}
{% block title %}Iniciar sesión | Futbol Team{% endblock %}

{% block extra_css %}
<style>
    /* Clases reutilizadas para mantener la coherencia (idealmente, en un futuro, 
       podés mover estas clases a un archivo style.css general) */
    .focus-container {
        min-height: calc(100vh - 150px);
        display: flex;
        align-items: center;
        padding: 2rem 0;
    }

    .form-control-custom {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-soft);
        color: white;
        border-radius: 12px;
        padding: 12px 16px;
        transition: all 0.3s ease;
    }

    .form-control-custom:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        color: white;
        outline: none;
    }

    .form-control-custom::placeholder {
        color: rgba(255, 255, 255, 0.3);
    }

    .form-label {
        font-weight: 600;
        color: #e2e8f0;
        margin-bottom: 8px;
        font-size: 0.95rem;
    }

    .input-icon-wrapper {
        position: relative;
    }

    .input-icon-wrapper i {
        position: absolute;
        top: 50%;
        left: 16px;
        transform: translateY(-50%);
        color: var(--text-soft);
        font-size: 1.1rem;
    }

    .input-icon-wrapper .form-control-custom {
        padding-left: 45px;
    }

    /* Estilo para el enlace de registro */
    .auth-link {
        color: var(--accent-blue);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
    }

    .auth-link:hover {
        color: #7dd3fc;
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center focus-container">
    <div class="col-lg-5 col-md-7 col-sm-10">
        <div class="glass-card p-5">
            
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(56,189,248,0.15)); color: var(--accent-green);">
                    <i class="bi bi-shield-lock fs-1"></i>
                </div>
                <h2 class="fw-bold mb-2">Bienvenido de vuelta</h2>
                <p class="text-soft mb-0">Ingresá tus credenciales para armar tus equipos.</p>
            </div>

            <form method="post" action="">
                {% csrf_token %}

                <div class="mb-4">
                    <label for="username" class="form-label">Usuario</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-person"></i>
                        <input 
                            type="text" 
                            id="username"
                            name="username" 
                            class="form-control-custom w-100" 
                            placeholder="Tu nombre de usuario"
                            required
                        >
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-key"></i>
                        <input 
                            type="password" 
                            id="password"
                            name="password" 
                            class="form-control-custom w-100" 
                            placeholder="••••••••"
                            required
                        >
                    </div>
                </div>

                <div class="d-grid mt-5 mb-4">
                    <button type="submit" class="btn btn-main btn-lg" style="border-radius: 14px;">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Ingresar a la cancha
                    </button>
                </div>
            </form>

            <hr class="border-secondary my-4" style="opacity: 0.3;">

            <div class="text-center text-soft">
                ¿Todavía no tenés cuenta? <br>
                <a href="{% url 'registro' %}" class="auth-link mt-1 d-inline-block">
                    Registrate gratis acá
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
